<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Pulse compatibility fixture</title>
<script type="module">
import { compareCheckpointTraces, createCheckpointTrace, createEngine, digestCheckpoint, replayCommands, validateReplayRecord } from '../src/index.js';
try {
  const engine = createEngine({ initialState: { count: 0 }, seed: 'browser', rules: [{ id: 'count', condition: ({ action }) => action.type === 'add', effect: ({ state, random }) => ({ state: { count: state.count + random.integer(1, 3) }, events: [{ type: 'counted' }] }) }] });
  engine.schedule({ type: 'add' }, { at: 1, interval: 1, limit: 3 });
  const saved = engine.exportSave(); engine.advance(3); const expected = engine.snapshot();
  engine.importSave(saved); engine.advance(3);
  if (JSON.stringify(engine.snapshot()) !== JSON.stringify(expected)) throw Error('Restore diverged.');
  if (engine.getTick() !== 3 || engine.inspect().traces.length !== 6) throw Error('Unexpected tick/trace count.');
  const asyncEngine = createEngine({ plugins: [{ id: 'async-random', async onAction({ random }) {
    await Promise.resolve();
    random.next();
  } }] });
  const beforeAsync = JSON.stringify(asyncEngine.snapshot());
  let asyncRejected = false;
  try { asyncEngine.dispatch({ type: 'test' }); }
  catch (error) { asyncRejected = error instanceof TypeError && /synchronous/.test(error.message); }
  await new Promise(resolve => setTimeout(resolve, 0));
  if (!asyncRejected || JSON.stringify(asyncEngine.snapshot()) !== beforeAsync) throw Error('Async hook changed the checkpoint after rejection.');
  const entries = [];
  engine.pause();
  const recording = engine.startRecording({ configurationId: 'browser/v1', retainCommands: false, sink(entry) { entries.push(entry); } });
  engine.advance(5);
  engine.resume();
  engine.advance(2);
  recording.stop();
  const replay = validateReplayRecord({ ...entries[0].record, commands: entries.slice(1, -1).map(entry => entry.command) });
  if (!replay.initialPaused || replay.commands.length !== 3 || engine.getTick() !== 5 ||
      recording.getStatus().retainedCommandCount !== 0 || entries.at(-1).commandCount !== 3) throw Error('Recording diverged.');
  const replayed = replayCommands(replay, {
    expectedConfigurationId: 'browser/v1',
    createConfiguredEngine({ seed }) {
      return createEngine({ initialState: { count: 0 }, seed, rules: [
        { id: 'count', condition: ({ action }) => action.type === 'add',
          effect: ({ state, random }) => ({ state: { count: state.count + random.integer(1, 3) }, events: [{ type: 'counted' }] }) }
      ] });
    }
  });
  if (replayed.status !== 'completed' || JSON.stringify(replayed.finalSnapshot) !== JSON.stringify(engine.snapshot())) {
    throw Error('Replay execution diverged.');
  }
  const originalFingerprint = await digestCheckpoint(engine.snapshot());
  const replayFingerprint = await digestCheckpoint(replayed.finalSnapshot);
  if (!/^sha256-v1:[a-f0-9]{64}$/.test(originalFingerprint) || replayFingerprint !== originalFingerprint)
    throw Error('Browser replay checkpoint digest diverged.');
  const goldenEngine = createEngine({ seed: 17, initialState: {
    unicode: { '雪': '雪', 'é': 'café', emoji: '💡', line: 'line\nbreak' },
    numericKeys: { '10': 'ten', '2': 'two', '01': 'leading' },
    arr: [{ z: 1, a: 2 }, [], { x: -2.5, y: 0.125 }],
    empty: {}, min: -42, max: 9007199254740991
  } });
  const goldenDigest = await digestCheckpoint(goldenEngine.snapshot());
  if (goldenDigest !== 'sha256-v1:99d9717525ff774ceb0ed9dc2d83ce37ceb63abf32c0ecf12db70a92106eca20')
    throw Error('Cross-runtime golden digest changed.');
  goldenEngine.dispose();
  const baseCheckpoint = engine.snapshot();
  const changedCheckpoint = structuredClone(baseCheckpoint);
  changedCheckpoint.state.count += 1;
  const startCheck = { sequence: 0, kind: 'initial', tick: baseCheckpoint.tick, outcome: null, snapshot: baseCheckpoint };
  const nextCheck = { sequence: 1, kind: 'dispatch', tick: baseCheckpoint.tick,
    outcome: { status: 'accepted' }, snapshot: baseCheckpoint };
  const originalTrace = await createCheckpointTrace({
    configurationId: 'browser/v1', commandCount: 1,
    checkpoints: [startCheck, nextCheck], includeSnapshots: true
  });
  const candidateTrace = await createCheckpointTrace({
    configurationId: 'browser/v1', commandCount: 1,
    checkpoints: [startCheck, { ...nextCheck, snapshot: changedCheckpoint }], includeSnapshots: true
  });
  const browserDiff = compareCheckpointTraces(originalTrace, candidateTrace);
  if (browserDiff.status !== 'diverged' || browserDiff.firstObservedSequence !== 1 ||
      browserDiff.category !== 'state' || browserDiff.path !== '/state/count' || 'values' in browserDiff)
    throw Error('Browser divergence diagnostics contract failed.');
  const failed = engine.startRecording({ configurationId: 'browser/v1', sink(entry) { if (entry.type === 'command') throw Error('Sink failed.'); } });
  let recordingRejected = false;
  try { engine.step(); } catch (error) { recordingRejected = error.code === 'PULSE_RECORDING'; }
  if (!recordingRejected || failed.getStatus().state !== 'failed' || engine.getTick() !== 6) throw Error('Recording failure contract diverged.');
  failed.stop();
  engine.dispose();
  asyncEngine.dispose();
  window.pulseResult = { ok: true };
} catch (error) { window.pulseResult = { ok: false, reason: error.message }; }
</script></html>
