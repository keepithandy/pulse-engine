<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Pulse compatibility fixture</title>
<script type="module">
import { createEngine } from '../src/index.js';
try {
  const engine = createEngine({ initialState: { count: 0 }, seed: 'browser', rules: [{ id: 'count', condition: ({ action }) => action.type === 'add', effect: ({ state, random }) => ({ state: { count: state.count + random.integer(1, 3) }, events: [{ type: 'counted' }] }) }] });
  engine.schedule({ type: 'add' }, { at: 1, interval: 1, limit: 3 });
  const saved = engine.exportSave(); engine.advance(3); const expected = engine.snapshot();
  engine.importSave(saved); engine.advance(3);
  if (JSON.stringify(engine.snapshot()) !== JSON.stringify(expected)) throw Error('Restore diverged.');
  if (engine.getTick() !== 3 || engine.inspect().traces.length !== 6) throw Error('Unexpected tick/trace count.');
  const asyncEngine = createEngine({ plugins: [{ id: 'async-random', async onAction({ random }) {
    await Promise.resolve();
    random.next();
  } }] });
  const beforeAsync = JSON.stringify(asyncEngine.snapshot());
  let asyncRejected = false;
  try { asyncEngine.dispatch({ type: 'test' }); }
  catch (error) { asyncRejected = error instanceof TypeError && /synchronous/.test(error.message); }
  await new Promise(resolve => setTimeout(resolve, 0));
  if (!asyncRejected || JSON.stringify(asyncEngine.snapshot()) !== beforeAsync) throw Error('Async hook changed the checkpoint after rejection.');
  window.pulseResult = { ok: true };
} catch (error) { window.pulseResult = { ok: false, reason: error.message }; }
</script></html>
